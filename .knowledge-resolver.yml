# KODA Knowledge Resolver Configuration
# Defines how URNs are resolved to physical file paths
# Spec: urn:knowledge:koda:core:federation:1.0.0

# =============================================================================
# METADATA - Required for federation health tracking
# =============================================================================
_meta:
  resolver_version: "1.0.0"
  koda_compatibility: ">=1.0.0 <2.0.0"
  last_sync: "2025-11-26T00:13:00Z"
  health_check_interval: weekly

# =============================================================================
# SELF - This repository's identity in the federation
# =============================================================================
self:
  namespace: koda
  repository: "github.com/koda-framework/koda"
  visibility: public
  maintainer: "fs@sanixai.com"
  role: upstream  # This is the upstream source for all KODA-compliant repos

# =============================================================================
# NAMESPACES - Federated namespace resolution
# =============================================================================
namespaces:
  # KODA - Framework base (this repository)
  koda:
    type: local
    base_path: "./"
    required: true
    description: "KODA Framework - Knowledge-Oriented Design Architecture"

  # SANIXAI - Commercial organization (peer)
  sanixai:
    type: peer
    base_path: "../sanixai/"
    fallback: "https://raw.githubusercontent.com/felix-antonio-sl/sanixai/main/"
    required: false
    description: "SANIXAI - Productos comerciales y proyectos clientes"

  # GORENUBLE - Gobierno Regional de Ñuble (peer)
  gorenuble:
    type: peer
    base_path: "../gorenuble/"
    fallback: "https://raw.githubusercontent.com/felix-antonio-sl/gorenuble/main/"
    required: false
    description: "Gobierno Regional de Ñuble - Conocimiento institucional"

  # TDE - Transformación Digital del Estado de Chile (peer)
  tde:
    type: peer
    base_path: "../tde/"
    fallback: "https://raw.githubusercontent.com/felix-antonio-sl/tde/main/"
    required: false
    description: "TDE - Transformación Digital del Estado de Chile, Ley 21.180"

  # FXSL - Personal/Private (peer)
  fxsl:
    type: peer
    base_path: "../fxsl/"
    fallback: "https://raw.githubusercontent.com/felix-antonio-sl/fxsl/main/"
    required: false
    description: "FXSL - Proyectos personales y experimentación"

resolution_rules:
  # Core guides
  "urn:knowledge:koda:core:quickstart:*": "./knowledge/core/guide_core_000_quickstart_koda.yml"
  "urn:knowledge:koda:core:spec:*": "./knowledge/core/guide_core_001_koda-spec_koda.yml"
  "urn:knowledge:koda:core:transform:*": "./knowledge/core/guide_core_002_koda-transform_koda.yml"
  "urn:knowledge:koda:core:hub:*": "./knowledge/core/guide_core_003_koda-hub-master_koda.yml"
  "urn:knowledge:koda:core:life:*": "./knowledge/core/guide_core_004_koda-life-master_koda.yml"
  "urn:knowledge:koda:core:agent:*": "./knowledge/core/guide_core_005_koda-agent-spec_koda.yml"
  "urn:knowledge:koda:core:agent-construct:*": "./knowledge/core/guide_core_006_koda-agent-construct_koda.yml"
  "urn:knowledge:koda:core:test:*": "./knowledge/core/guide_core_007_koda-test-spec_koda.yml"
  "urn:knowledge:koda:core:schema-versioning:*": "./knowledge/core/guide_core_008_schema-versioning_koda.yml"
  "urn:knowledge:koda:core:federation:*": "./knowledge/core/guide_core_009_federation-protocol_koda.yml"
  
  # Schema
  "urn:knowledge:koda:core:agent-schema:*": "./schemas/koda-agent-schema-1.0.0.json"
  
  # Agents
  "urn:knowledge:koda:agents:architect:*": "./agents/knowledge-architect/agent_koda_architect.yaml"
  "urn:knowledge:koda:agents:transformer:*": "./agents/koda-transformer/agent_koda_transformer.yaml"
  "urn:knowledge:koda:agents:smith:*": "./agents/koda-smith/agent_koda_smith.yaml"
  "urn:knowledge:koda:agents:guardian:*": "./agents/koda-guardian/agent_koda_guardian.yaml"
  "urn:knowledge:koda:agents:tester:*": "./agents/koda-tester/agent_koda_tester.yaml"
  "urn:knowledge:koda:agents:sim-orchestrator:*": "./agents/koda-sim-orchestrator/agent_koda_sim_orchestrator.yaml"
  "urn:knowledge:koda:agents:orquestador-generico:*": "./agents/orquestador-generico/agent_orquestador_generico.yaml"
  
  # Registry
  "urn:knowledge:koda:registry:namespaces:*": "./registry/namespaces.yml"

# Directory structure conventions
directories:
  knowledge: "./knowledge/"
  core: "./knowledge/core/"
  domains: "./knowledge/domains/"
  schemas: "./schemas/"
  agents: "./agents/"
  catalog: "./catalog/"
  staging: "./staging/"
  sources: "./sources/"

cache:
  enabled: true
  ttl_seconds: 86400  # 24 hours
