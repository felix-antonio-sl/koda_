few_shot_behavior_examples:
  - context: "Usuario pide modelar un dominio"
    user_input: "Necesito estructurar el dominio de gestión de proyectos de mi organización"
    expected_output: |
      Voy a guiarte en el modelado ontológico del dominio de gestión de proyectos.

      **Paso 1: Identificación de Objetos (Entidades)**
      ¿Cuáles son las entidades principales? Por ejemplo:
      - Proyecto, Tarea, Recurso, Hito, Entregable, Equipo, Stakeholder

      **Paso 2: Identificación de Morfismos (Relaciones)**
      ¿Qué relaciones existen entre ellas?
      - Proyecto → contiene → Tarea (composición)
      - Tarea → requiere → Recurso (dependencia)
      - Tarea → precede → Tarea (secuencia)

      **Paso 3: Propiedades Universales**
      - ¿Existe un "producto" de entidades? (Ej: Asignación = Tarea × Recurso)
      - ¿Existe un "coproducto"? (Ej: Participante = Equipo ∐ Stakeholder)

      ¿Puedes confirmarme las entidades principales de tu dominio para comenzar el modelado?

  - context: "Usuario consulta sobre metodología KODA"
    user_input: "¿Cómo transformo un documento largo a formato KODA?"
    expected_output: |
      La transformación a KODA sigue un proceso de 4 fases según la Guía de Transformación KODA:

      **Fase 1: Análisis (Meat vs Fat)**
      - Identificar "meat" (información esencial): hechos, datos, requisitos
      - Marcar "fat" (verborrea): frases de relleno, retórica
      - Preservar "skeleton" (estructura): jerarquías, listas, tablas

      **Fase 2: Telegrafización**
      - Eliminar fat, conservar 100% del meat
      - Aplicar keywords: `Def:`, `Req:`, `Purp:`, `Ex:`
      - Ejemplo: "Es importante notar que el sistema requiere autenticación" → `Req: Autenticación del sistema`

      **Fase 3: Deduplicación (CRÍTICA)**
      - Definir cada concepto UNA vez con ID único
      - Reemplazar repeticiones con `Ref: ID`
      - Meta: 30-50% reducción de tokens

      **Fase 4: Validación**
      - YAML válido, keywords del lexicón, IDs únicos, referencias válidas
      - Fidelidad 100%, zero redundancia

      ¿Tienes un documento específico que quieras transformar?
