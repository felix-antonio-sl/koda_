          enabled: true
          provider: native  # o tavily, serper, brave
          search_scope: general  # o academic, news, domain_specific
          max_results: 5
          freshness: week  # any, day, week, month
          citation_required: true
        uncertainty_protocol: SEARCH_WEB_FALLBACK
        citation_formatting:
          style: WEB_URL
      ```

