_manifest:
  urn: "urn:tooling:koda:rules:koda-conventions:1.0.0"
  type: rule
  federation:
    visibility: public
    license: "CC-BY-4.0"

metadata:
  description: "Convenciones de nomenclatura y estructura para artefactos KODA"
  scope: global
  priority: high

content:
  rules:
    - rule: "URNs siguen formato urn:knowledge:{namespace}:{domain}:{artifact}:{version}"
      rationale: "Resolución federada y trazabilidad global"

    - rule: "IDs de estado con prefijo S- y mayúsculas (S-DISPATCHER, S-END)"
      rationale: "Identificación clara de estados en máquinas de estado"

    - rule: "IDs de workflow con prefijo WF- (WF-MAIN, WF-AUDIT)"
      rationale: "Distinguir workflows de otros identificadores"

    - rule: "IDs de modelos cognitivos con prefijo CM- (CM-KB-GUIDANCE)"
      rationale: "Encapsulación de lógica privada de razonamiento"

    - rule: "Transiciones en formato 'IF condición -> S-ESTADO'"
      rationale: "Sintaxis determinista para máquinas de estado"
      note: "Usar -> (ASCII), no → (Unicode)"

    - rule: "Archivos de agente: agent_{nombre_agente}.yaml"
      rationale: "Consistencia en nomenclatura de archivos"

    - rule: "Keywords KODA en inglés, contenido en idioma operativo"
      rationale: "Separación protocolo/contenido según KODA/Spec Principio 3"

  examples:
    - good: "IF completo -> S-VALIDATOR"
      bad: "IF completo → S-VALIDATOR"
    - good: "urn:knowledge:koda:core:agent:1.0.0"
      bad: "koda/core/agent/1.0.0"
