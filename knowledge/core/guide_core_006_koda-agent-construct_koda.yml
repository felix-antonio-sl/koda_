ID: KODA-AGENT-CONSTRUCT-01
Version: 1.0.0
Status: Published
Source: GUIDE-KODA-MASTER-03
Creation-Date: 2025-11-25
Modification-Date: 2025-12-08
Ctx: Prescriptive methodology for constructing KODA-compliant AI agents

LLM_Parsing_Instructions:
  ID: KODA-LLM-PARSER-01
  Req: Mandatory block following Metadata.
  Prohib: Using for artifact creation or translation.
  Content: |
    BEGIN_LLM_INSTRUCTIONS
    You are an AI agent consuming a KODA artifact. Parse with absolute fidelity.

    FIDELITY: Preserve meat (essential information) and skeleton (structure: headers, IDs, lists, tables) with zero loss. Ignore fat (filler words, rhetoric, stylistic prose).

    LEXICON (expand before processing): Act->Action, Cond->Condition, Ctx->Context, Ctx_Required->Required External Reference, Ctx_Optional->Optional External Reference, Def->Definition, Ex->Example, Mssn->Mission, Obj->Objective, Proc->Process, Purp->Purpose, Ref->Reference, XRef->Cross-Artifact Reference, XRef_Required->Mandatory Cross-Artifact Reference, Req->Requirement, Res->Result, Src->Source, Prohib->Prohibition, Warn->Warning, Just->Justification, Rec->Recommendation

    REFERENCE POLICY: Ref: is internal only—must point to existing ID within THIS document. XRef/XRef_Required: are external only—must point to a URN (optionally with #ID fragment) in another artifact. External documents without specific ID use Ctx:, Ctx_Required:, or Ctx_Optional:.

    LANGUAGE POLICY: Keywords in English, content in original language. Never translate content.
    END_LLM_INSTRUCTIONS

Purp: Guide for constructing KODA agents with max fidelity.
Obj: Systematic process requirements->validated_artifact.

Construction_Overview:
  ID: CONSTRUCT-OVERVIEW-01
  Input: Requirements (role, capabilities, KB, constraints)
  Output: Validated agent.yaml
  Metrics:
    [
      "Behavioral_Fidelity",
      "Principle_Compliance",
      "Security_Completeness",
      "Knowledge_Traceability",
    ]
  Success: ["Pass_Validation", "Valid_YAML", "Reachable_States", "Hidden_Logic"]

Phase1_Requirements:
  ID: PHASE-REQUIREMENTS
  Obj: Document agent identity and boundaries.
  Steps:
    - Define_Identity: Role, Objective, Audience, Content_Lang.
    - Map_Knowledge: Sources, Policy (Exclusive/Hybrid), Citation_Style, Uncertainty.
    - Define_Boundaries: Scope, Rejection_Policy, Confidentiality.
    - Workflow_Reqs: Interaction_Patterns, States, Transitions.

Phase2_Architecture:
  ID: PHASE-ARCHITECTURE
  Obj: Design agent structure (States, CMs, KB).
  Steps:
    - Design_State_Machine:
        Proc: Define states, entry, transitions, terminal.
        Out: State diagram.
    - Design_Cognitive_Models:
        Proc: Extract logic >5 steps to CMs. Define dimensions.
        Constraint: Public steps <= 5.
        Out: CM specs.
    - Select_KB_Mode:
        Rules:
          - Domain KB -> KB_BASED (EXCLUSIVE/ALLOW_GENERAL)
          - Real-time + Domain -> HYBRID_WEB_KB
          - Real-time only -> WEB_AUGMENTED
          - General reasoning -> LLM_NATIVE
    - Design_Catalog_Resolution:
        Cond: KB-based/Hybrid.
        Proc: Set catalog URN, strategy=CATALOG_FIRST, CM-CATALOG-RESOLVER.
    - Design_KB_Guidance:
        Cond: KB-based/Hybrid.
        Proc: Map Topics->URNs. Create CM-KB-GUIDANCE.
        Req: Must chain CM-CATALOG-RESOLVER -> CM-KB-GUIDANCE.
    - Design_Web_Search:
        Cond: Web/Hybrid.
        Proc: Provider, Scope, Freshness, CM-WEB-SEARCH.
    - Design_Self_Eval:
        Proc: Behavioral invariants, CONTEXT_SHIFT check, Correction protocol.

Phase3_Construction:
  ID: PHASE-CONSTRUCTION
  Obj: Build agent.yaml.
  Steps:
    - Init_Artifact: Create file with Runtime Directive.
      Template: |
        # KODA Agent Definition for <NAME>
        # ID: <ID>
        # Ref: urn:knowledge:koda:core:agent:1.0.0
        ---
    - Add_Runtime_Instr: Use Standard_Template from guide_005.
    - Build_Identity: primary_role_objective_and_audience, settings.
    - Build_Knowledge: catalog_resolution, usage_policy, web_search, uncertainty, citation.
      Templates:
        KB_BASED: |
          catalog_resolution:
            catalog_urn: "urn:knowledge:{ns}:catalog:master:1.0.0"
            resolution_strategy: CATALOG_FIRST
          usage_policy_and_source_management:
            policy: EXCLUSIVE_USE
            source_artifacts: ["urn:knowledge:{ns}:{dom}:{art}:1.0.0"]
        LLM_NATIVE: |
          usage_policy_and_source_management: {policy: LLM_NATIVE}
        HYBRID: |
          catalog_resolution: {catalog_urn: "...", resolution_strategy: CATALOG_FIRST}
          usage_policy_and_source_management: {policy: HYBRID_WEB_KB, source_artifacts: [...]}
          web_search_configuration: {enabled: true, scope: domain_specific}
    - Build_Workflow: defined_workflows, defined_states.
    - Build_Reasoning: private_internal_reasoning_processes (CMs).
      Req: "_meta {expose: false}, dimensions."
      Templates:
        CM-CATALOG-RESOLVER: |
          process: [1. Receive URN, 2. Query catalog, 3. Return path]
        CM-KB-GUIDANCE: |
          resolution: "Invoke CM-CATALOG-RESOLVER first"
          routing_map: [{q: "Topic", r: "URN"}]
    - Build_IO: communication_tone, response_formatting, interactions.
    - Build_Safety: Minimum Guard Set (KODA-GUARD-SET-01).
    - Build_Meta: evaluation_process, correction_protocol.

Phase4_Validation:
  ID: PHASE-VALIDATION
  Obj: "Verify quality. Ref: KODA-VALIDATION-CHECKLIST-01."
  Checklist:
    Syntax: ["YAML_Valid", "Directive_Present", "Runtime_Instr_Present"]
    Principles:
      - P1_Declarative: No imperative code.
      - P3_Separation: Keys=En, Values=Content_Lang.
      - P4_Cartography: CM-CATALOG-RESOLVER + CM-KB-GUIDANCE present.
      - P5_Abstraction: forbid_internal_jargon=true.
      - P6_Coherence: States/transitions valid.
      - P7_Federation: Source_artifacts use URNs.
    Security:
      [
        "Guard_Set_Complete",
        "No_Logic_Exposure(<=5 steps)",
        "Private_Models_Hidden",
      ]
    Structure:
      ["Valid_Refs", "Valid_Entry", "Reachable_States", "CM_Refs_Valid"]
    Federation: ["URN_Format", "Deps_Resolvable"]
  Failure_Response:
    - Syntax/Logic/Ref/Guard failures -> Fix -> Retry Phase 3.

Phase5_Deployment:
  ID: PHASE-DEPLOYMENT
  Steps:
    - Register_Catalog: Add URN, dependencies.
    - Prepare_KB: Verify access.
    - Platform_Integration: Config for target (ChatGPT/Claude).
    - Versioning: 'Commit "feat(agent): initial".'

Patterns:
  ID: KODA-PATTERNS-01
  List:
    - Pattern: Catalog_SOT (Source of Truth)
      Principle: Catalog First, Static Fallback.
      Impl: Dependencies=SOURCE_OF_TRUTH, CM-CATALOG-RESOLVER.
    - Pattern: LLM_Native
      Principle: Trust LLM, Declare Boundaries.
      Impl: Policy=LLM_NATIVE, CM-LLM-BOUNDARY.
    - Pattern: Web_Search
      Principle: Search, Verify, Cite.
      Impl: Policy=WEB_AUGMENTED, CM-WEB-SEARCH.
    - Pattern: Hybrid_Router
      Principle: KB(Depth) + Web(Freshness).
      Impl: Policy=HYBRID_WEB_KB, CM-KNOWLEDGE-ROUTER.
    - Pattern: KB_Functor
      Principle: Preserve structure Query->Doc.
      Impl: CM-KB-GUIDANCE mapping.
    - Pattern: Monadic_Encapsulation
      Principle: Public Interface + Private Implementation.
      Impl: State process invokes private CM.
    - Pattern: Context_Manager
      Principle: Handle Topic Shifts.
      Impl: CM-CONTEXT-MANAGER + Check in Eval.
    - Pattern: Federated_KB
      Principle: Cross-repo sharing.
      Impl: URN refs in source_artifacts.
    - Pattern: Bootloader
      Principle: Platform init.
      Impl: Initial_prompt, Platform config.

Anti_Patterns:
  ID: KODA-ANTI-PATTERNS-01
  List:
    - Logic_Exposure: ">5 steps/complex conditionals public. Fix: Extract to CM."
    - No_Catalog_Res: "Skipping catalog. Fix: Catalog SOT."
    - Implicit_KB: "Auto-retrieval. Fix: Explicit Routing."
    - Hardcoded_Paths: "File paths in sources. Fix: URNs."
    - No_Context: "Stuck in state. Fix: Context Manager."
    - Incomplete_Guard: "Missing safety. Fix: Complete Set."

HOA_Construction:
  ID: KODA-HOA-CONSTRUCT-01
  Purp: Construct Higher-Order Agents (Orchestrators).
  Ctx: urn:knowledge:koda:core:agent:1.0.0 §9
  Overview: Use when task needs multiple specialized capabilities, isolation, or pipelines.
  Phases:
    P0_Assessment:
      Matrix:
        - Single domain -> Standard Agent
        - Multiple domains/Isolation -> HOA
        - Testing/Pipeline -> HOA
    P1_Ext_Requirements:
      Add: "Fleet (sub-agents, static/dynamic), Orchestration (Pattern: SEQ/PAR/COND/ITER), Context (Shared state)."
    P2_Fleet_Design:
      Out: Fleet def, Delegation flow, Shared schema.
      HOA_States: S-LOADER(dynamic), S-PLANNER, S-EXECUTOR, S-SYNTHESIZER.
      HOA_CMs: CM-AGENT-LOADER, CM-DELEGATION-DISPATCHER, CM-SYNTHESIS-ENGINE.
    P3_Ext_Construction:
      Add_Ns: orchestration_fleet_and_protocol (sub_agents, protocol).
      Runtime_Instr: "Add Point 8 (ORCHESTRATION: Delegate, don't execute)."
    P4_Ext_Validation:
      Checks: Fleet_Valid, Protocol_Defined, No_Self_Delegation, Orchestration_Fidelity.
    P5_Ext_Deployment:
      Add: Register sub-agents, Mark higher_order=true.
  HOA_Patterns:
    - TESTING: TESTER -> AUT (Iterative).
    - PIPELINE: Stage1 -> Stage2 (Sequential).
    - MULTI-PERSPECTIVE: PerspA + PerspB (Parallel).
  HOA_Anti_Patterns:
    - Doing_Not_Delegating: HOA executing work.
    - Ambiguous_Evidence: Mixing real/simulated.
    - Missing_Synthesis: Raw outputs.
    - Unbounded_Iteration: No max_loops.

Token_Economy_Checklist:
  ID: KODA-TOKEN-ECONOMY-CHECKLIST-01
  Checks:
    - RUNTIME_COMPACT: Std Template (<=12 lines).
    - LLM_PARSING_COMPACT: Compact format (<=4 lines).
    - NO_HUMAN_PROSE: Optimized for LLM.
    - REF_DEDUPLICATION: Use Ref/XRef.
    - TOKEN_TARGET: <=40% vs verbose.
  Failure: Refactor or apply CM-TELEGRAFIZER.
