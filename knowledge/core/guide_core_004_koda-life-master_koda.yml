LLM_Parsing_Instructions:
  ID: KODA-LLM-PARSER-01
  Req: Mandatory block following Metadata.
  Prohib: Using for artifact creation or translation.
  Content: |
    BEGIN_LLM_INSTRUCTIONS
    You are an AI agent consuming a KODA artifact. Parse with absolute fidelity.

    FIDELITY: Preserve meat (essential information) and skeleton (structure: headers, IDs, lists, tables) with zero loss. Ignore fat (filler words, rhetoric, stylistic prose).

    LEXICON (expand before processing): Act->Action, Cond->Condition, Ctx->Context, Ctx_Required->Required External Reference, Ctx_Optional->Optional External Reference, Def->Definition, Ex->Example, Mssn->Mission, Obj->Objective, Proc->Process, Purp->Purpose, Ref->Reference, XRef->Cross-Artifact Reference, XRef_Required->Mandatory Cross-Artifact Reference, Req->Requirement, Res->Result, Src->Source, Prohib->Prohibition, Warn->Warning, Just->Justification, Rec->Recommendation

    REFERENCE POLICY: Ref: is internal only—must point to existing ID within THIS document. XRef/XRef_Required: are external only—must point to a URN (optionally with #ID fragment) in another artifact. External documents without specific ID use Ctx:, Ctx_Required:, or Ctx_Optional:.

    LANGUAGE POLICY: Keywords in English, content in original language. Never translate content.
    END_LLM_INSTRUCTIONS

Preliminaries:
  Mssn: Unified framework for agent engineering.
  Scope: "Full lifecycle (RAG/Action). Out: Fine-tuning execution."
  Prereqs: Spec(001), Transform(002), Agent(005).

Philosophy_Architecture:
  Mission: Prompt Crafting -> Agent Engineering.
  Agent_As_Software: Max predictability/maintainability.
  Separation_Of_Concerns:
    Code (HOW): agent.yaml (Declarative).
    Data (WHAT): KB artifacts (Structured).
    P_Public_Private: Interface (Workflows) vs Implementation (Hidden CMs).
    P_Abstraction: No internal jargon exposed.
    P_Cartography: Explicit Query->Doc mapping (CM-KB-GUIDANCE).
    P_Execution: Direct vs Indirect (Bootloader).
    P_Category: Agent components obey category theory (Functors/Morphisms).
  Strategic_Distinctions:
    Product (Custom GPTs): Self-contained, UI provided.
    Engine (Assistants API): Headless, Integration required.
    First_Order: Task executor.
    Higher_Order: Orchestrator (Fleet definition).

Agent_Lifecycle_Phases:
  P1_Conception:
    Obj: Define What/Why/Where.
    Steps:
      - 1.1 Strategy: Product/Engine? First/Higher Order? Platform constraints?
      - 1.2 Charter: Draft requirements -> agent.yaml skeleton.
      - 1.3 Model: RAG vs Fine-tuning.
    Gate: P1_GUARD (Minimum Guard Set present).

  P2_KB_Curation:
    Obj: Build data foundation (RAG-optimized).
    Steps:
      - 2.1 Transcribe/Refactor: Text->KODA, Forms->SFD.
      - 2.2 Packaging: File structure, limits consolidation.
      - 2.3 Sync: Protocol for platform knowledge store.

  P3_ADP_Programming:
    Obj: Write agent source code.
    Steps:
      - 3.1 Design-to-Code: Map requirements to Schema keys.
      - 3.2 Logic/Patterns: Implement States, CMs, Anti-Pattern Checks.
      - 3.3 Routing: Implement CM-KB-GUIDANCE (Cartography).
      - 3.4 API Review: Metric stability (for Engine).

  P4_Test_Deploy:
    Obj: Validate and Observe.
    Steps:
      - 4.1 Test: Unit/Integration/Regression.
      - 4.2 Observability: Metrics/Logs.
      - 4.3 Refine: "Debug Code/Data. Tactics: Rephrase, Order, Chain-of-Thought, Examples."
      - 4.4 Gate: CHECKLIST-02 (Runtime Directive, Principles, Bootloader).
      - 4.5 Deploy: Publish + Git Tag.

  P5_Maintenance:
    Obj: Sustain and Evolve.
    Steps:
      - 5.1 Git: Version control mandatory.
      - 5.2 Feedback: Collect/Analyze.
      - 5.3 Drift: Monitor Model/Data drift.
      - 5.4 Audit: Quarterly check against Guard Set.
      - 5.5 Change: New lifecycle iteration.

Git_Management:
  Repo_Structure:
    _desc: "Mono-repo (Hub/Federation)."
    /agents/: "Definitions."
    "/knowledge/": "Curated artifacts."
    "/sources/": "Raw input."
    "/staging/": "WIP."
  Branching:
    _model: GitFlow (Simplified).
    main: Prod (Protected).
    develop: Integration.
    feature/*: New capabilities.
    hotfix/*: Urgent production fixes.
  Commit_Convention:
    _style: Conventional Commits.
    fmt: "type(scope): subject"
    types: [feat, fix, kb, docs, refactor, chore]
  Release: Semantic Versioning (vX.Y.Z) tags on main merge.

Patterns_Annex:
  Patterns:
    - FTCF_Translation: Req->YAML mapping.
    - Input_Validator: Form-based agent.
    - Value_Chain: Workflow stages producing artifacts.
    - State_Encapsulation: Public State -> Private CM.
    - Bootloader: Meta-prompt for structured loading.
    - Dispatcher: Multi-thread routing.
    - KB_Guidance: Explicit cartography (CM).
    - Chain_of_Thought: <thinking> tags.
    - Agentic_Behavior: Persistent reminders.
    - Supra_Bootloader: Orchestrator fleet.
