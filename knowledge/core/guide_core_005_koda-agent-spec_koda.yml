ID: KODA-AGENT-SPEC-01
Version: 1.1.0
Status: Published
Source: GUIDE-KODA-MASTER-03
Creation-Date: 2025-11-25
Modification-Date: 2025-12-08
Ctx: Technical specification of KODA as YAML schema for declarative agent definition

LLM_Parsing_Instructions:
  ID: KODA-LLM-PARSER-01
  Req: Mandatory block following Metadata.
  Prohib: Using for artifact creation or translation.
  Content: |
    BEGIN_LLM_INSTRUCTIONS
    You are an AI agent consuming a KODA artifact. Parse with absolute fidelity.

    FIDELITY: Preserve meat (essential information) and skeleton (structure: headers, IDs, lists, tables) with zero loss. Ignore fat (filler words, rhetoric, stylistic prose).

    LEXICON (expand before processing): Act->Action, Cond->Condition, Ctx->Context, Ctx_Required->Required External Reference, Ctx_Optional->Optional External Reference, Def->Definition, Ex->Example, Mssn->Mission, Obj->Objective, Proc->Process, Purp->Purpose, Ref->Reference, XRef->Cross-Artifact Reference, XRef_Required->Mandatory Cross-Artifact Reference, Req->Requirement, Res->Result, Src->Source, Prohib->Prohibition, Warn->Warning, Just->Justification, Rec->Recommendation

    REFERENCE POLICY: Ref: is internal only—must point to existing ID within THIS document. XRef/XRef_Required: are external only—must point to a URN (optionally with #ID fragment) in another artifact. External documents without specific ID use Ctx:, Ctx_Required:, or Ctx_Optional:.

    LANGUAGE POLICY: Keywords in English, content in original language. Never translate content.
    END_LLM_INSTRUCTIONS

Purp: Define KODA/Agent as formal YAML schema.
Obj: Transform requirements -> unambiguous definition.

ADP_Definition:
  Def: YAML schema for declarative AI agent specification.
  Principles:
    - P1_Source_Code: YAML is code, LLM is interpreter.
    - P2_Structure_Meaning: Hierarchy conveys context.
    - P3_Separation: Keys=English, Values=Content_Lang.
    - P4_Cartography: Explicit KB pathing (No implicit semantic search).
    - P5_Abstraction: No internal jargon exposed.
    - P6_Category: Agent=Category, State=Object, Transition=Morphism.
    - P7_Federation: KB composed via URN references.

Schema:
  Base: YAML 1.2
  Runtime_Directive:
    Req: First block.
    Template: |
      # KODA Agent Definition for <NAME>
      # ID: <ID>
      # Ref: urn:knowledge:koda:core:agent:1.0.0

  Runtime_Instructions:
    Req: Follows directive.
    Templates: [Standard_Template (Compact)]
    Content: |
      KODA_Runtime_Instructions:
        ID: KODA-RUNTIME-<ID>
        Activation: "You ARE this agent. Execute."
        Content: |
          BEGIN_KODA_RUNTIME
          ... [Standard Instructions] ...
          END_KODA_RUNTIME

  Required_Namespaces:
    ns_identity:
      Key: agent_identity_and_global_configuration
      Fields: [primary_role_objective_and_audience, settings]
    ns_knowledge:
      Key: knowledge_base_interaction_and_governance_rules
      Fields:
        [
          catalog_resolution,
          usage_policy_and_source_management,
          web_search_configuration,
          uncertainty_protocol,
          citation_formatting,
        ]
      Modes: [KB_BASED, LLM_NATIVE, HYBRID_WEB_KB]
    ns_behavior:
      Key: public_behavior_workflows_and_states
      Fields: [defined_workflows, defined_states]
    ns_reasoning:
      Key: private_internal_reasoning_processes
      Fields: ["CM-MODELS (_meta {expose:false}, dimensions)"]
    ns_io:
      Key: input_output_style_format_and_interaction
      Fields: [response_formatting, communication_tone, user_interaction_rules]
    ns_safety:
      Key: safety_constraints_and_behavioral_guardrails
      Fields:
        [
          scope_and_rejection_policies,
          confidentiality_protection,
          communication_restrictions,
        ]
    ns_meta:
      Key: self_evaluation_and_correction_mechanisms
      Fields: [evaluation_process, correction_protocol]

  Optional_Namespaces:
    ns_orchestration:
      Key: orchestration_fleet_and_protocol
      Ctx: HOA only.
      Fields: [fleet_definition, orchestration_protocol]
    ns_tools:
      Key: external_tools_and_functions
    ns_examples:
      Key: few_shot_behavior_examples

Lexicon:
  Identity:
    role: "Primary role desc (Req)"
    objective: "Ultimate goal (Req)"
    audience: "Target user (Req)"
    content_lang: "BCP-47 code (Req)"

  Knowledge:
    catalog_resolution:
      {
        catalog_urn: null,
        strategy: [CATALOG_FIRST],
        fallback: [STATIC_ROUTING],
      }
    usage_policy:
      [EXCLUSIVE_USE, ALLOW_GENERAL, LLM_NATIVE, WEB_AUGMENTED, HYBRID]
    source_artifacts: [list of URNs]
    web_search: { enabled, provider, scope, freshness, domains }
    uncertainty: [DECLARE_ABSENCE, DECLARE_WITH_REASONING, SEARCH_WEB_FALLBACK]
    citation: [OFFICIAL_SOURCE, FILENAME, INLINE_REASONING, WEB_URL, HYBRID]

  Workflow:
    defined_workflows: { initial_state }
    defined_states:
      { role, process (<=5 steps), transitions (IF cond -> STATE) }

  Reasoning:
    CM-MODEL:
      {
        _meta: { expose: false },
        dimensions/steps: null,
        apply_on_trigger: null,
      }

  Safety:
    Minimum_Guard_Set:
      scope_policy: REJECT_OUT_OF_SCOPE
      block_instructions: true
      forbid_internal_jargon: true
      response_on_query: "Custom deflection"
      rejection_response: "Custom rejection"

  Meta:
    evaluation: { pre_response_hook: true, checklist: [] }
    correction: "IF check fails -> ACTION [REFINE | TRANSITION]"

  Orchestration (HOA):
    fleet: { sub_agents: [{ id, role, source, capabilities, instantiation }] }
    protocol:
      {
        objective: null,
        delegation_pattern: [SEQ|PAR|COND|ITER],
        workflow: null,
        synthesis: null,
      }
    shared_context:
      { session_id, orchestration_state, context_store, evidence_log }
    HOA_Runtime: "Add point 8: ORCHESTRATION (Delegate, don't execute)."

Validation:
  Syntax: YAML valid, Directive present, Schema compliant.
  Principles: No imperative, Keys=En, No implicit KB.
  Security: Guard Set complete, No logic exposure, CMs hidden.
  Structure: Valid refs (states/CMs), Reachable graph.
  Federation: Valid URNs.
  HOA: Fleet valid, No self-delegation.
