name: KODA Audit

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  
  workflow_dispatch:
    inputs:
      create_issue:
        description: 'Create issue if drift detected'
        required: false
        default: true
        type: boolean

jobs:
  audit:
    name: Full Framework Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/koda scripts/koda-*.sh || true

      - name: Run KODA Audit
        id: audit
        continue-on-error: true
        run: |
          ./scripts/koda-audit.sh 2>&1 | tee audit-report.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Upload Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: koda-audit-report
          path: audit-report.txt
          retention-days: 30

      - name: Create Issue on Drift
        if: steps.audit.outputs.exit_code != '0' && (github.event.inputs.create_issue == 'true' || github.event_name == 'schedule')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit-report.txt', 'utf8');
            
            // Check for existing open audit issue
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'auto:audit',
              state: 'open'
            });
            
            if (existingIssues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssues.data[0].number,
                body: `## Audit Update - ${new Date().toISOString().split('T')[0]}\n\n\`\`\`\n${report}\n\`\`\``
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔍 KODA Audit: Drift Detected',
                labels: ['auto:audit', 'type:maintenance', 'priority:P1'],
                body: `## Automated Audit Report\n\n**Date:** ${new Date().toISOString()}\n**Trigger:** ${context.eventName}\n\n### Findings\n\n\`\`\`\n${report}\n\`\`\`\n\n### Next Steps\n\n1. Review the drift items above\n2. Create specific issues for each item if needed\n3. Close this issue when all drift is resolved`
              });
            }

      - name: Audit Summary
        run: |
          if [[ "${{ steps.audit.outputs.exit_code }}" == "0" ]]; then
            echo "✅ KODA Audit passed - no drift detected"
          else
            echo "⚠️ KODA Audit found issues - see report"
            exit 1
          fi
