name: "🐛 Bug Report"
description: Report an inconsistency or error
title: "[BUG] "
labels: ["type:bug"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - guides (knowledge/core)
        - agents (agents/)
        - schemas (schemas/)
        - scripts (scripts/)
        - federation (registry, resolver)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What is wrong?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happens instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Run `koda validate`
        2. See error...

  - type: textarea
    id: files
    attributes:
      label: Affected Files
      placeholder: |
        - knowledge/core/guide_core_001_koda-spec_koda.yml (line 45)
