name: "✨ Enhancement"
description: Propose an improvement to KODA
title: "[FEAT] "
labels: ["type:enhancement"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - guides (knowledge/core)
        - agents (agents/)
        - schemas (schemas/)
        - scripts (scripts/)
        - federation (registry, resolver)
        - new component
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve?
      placeholder: Currently there is no way to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?

  - type: textarea
    id: references
    attributes:
      label: Related URNs/Guides
      description: Which KODA artifacts are relevant?
      placeholder: |
        - urn:knowledge:koda:core:spec:1.1.0
        - urn:knowledge:koda:core:federation:1.0.0
